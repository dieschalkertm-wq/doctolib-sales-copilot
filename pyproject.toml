[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctolib-sales-copilot"
version = "0.1.0"
description = "Persönlicher Sales Intelligence & Action Copilot (lokal-first)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",   # Validierung der Domain-Modelle (ARCHITECTURE §3)
    "pyyaml>=6.0",     # config/*.yaml (policies, territory, scoring)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
copilot = "copilot.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"copilot.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
